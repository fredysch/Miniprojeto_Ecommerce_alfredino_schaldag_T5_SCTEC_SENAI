version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: ecommerce_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: secretpassword
      POSTGRES_DB: ecommerce_db
    ports:
      - "5436:5436"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
    pgdata:
